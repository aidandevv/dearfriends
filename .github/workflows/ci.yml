name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      production:
        description: Deploy this ref to production
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3005
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      RESEND_API_KEY: re_ci_placeholder
      RESEND_FROM_EMAIL: ci@example.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm --ignore-workspace install --frozen-lockfile

      - name: Lint
        run: pnpm --ignore-workspace run lint

      - name: Type check
        run: pnpm --ignore-workspace run typecheck

      - name: Run unit and component tests with coverage
        run: pnpm --ignore-workspace run test:coverage

      - name: Upload coverage and unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  browser:
    name: Browser and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3005
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      RESEND_API_KEY: re_ci_placeholder
      RESEND_FROM_EMAIL: ci@example.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm --ignore-workspace install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --ignore-workspace exec playwright install --with-deps chromium

      - name: Build app for browser tests
        run: pnpm --ignore-workspace run build

      - name: Run public browser flows
        run: pnpm --ignore-workspace run test:e2e:public

      - name: Run accessibility checks
        run: pnpm --ignore-workspace run test:a11y

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  database:
    name: Database policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm --ignore-workspace install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm --ignore-workspace run db:start

      - name: Run migration and RLS policy tests
        run: pnpm --ignore-workspace run test:db

  authenticated-browser:
    name: Authenticated browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: database

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm --ignore-workspace install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --ignore-workspace exec playwright install --with-deps chromium

      - name: Start local Supabase
        run: pnpm --ignore-workspace run db:start

      - name: Build app with local Supabase credentials
        run: node scripts/with-local-supabase.mjs pnpm --ignore-workspace run build

      - name: Run authenticated browser flows
        run: pnpm --ignore-workspace run test:e2e:auth

      - name: Upload authenticated browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-browser-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Vercel deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    needs:
      - quality
      - browser
      - database
      - authenticated-browser
    if: |
      always() &&
      needs.quality.result == 'success' &&
      needs.browser.result == 'success' &&
      needs.database.result == 'success' &&
      needs.authenticated-browser.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      )
    environment:
      name: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.production == true)) && 'production' || 'preview' }}

    env:
      VERCEL_ENV: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.production == true)) && 'production' || 'preview' }}
      VERCEL_PROD_FLAG: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.production == true)) && '--prod' || '' }}
      HAS_VERCEL_SECRETS: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm --ignore-workspace install --frozen-lockfile

      - name: Check Vercel credentials
        if: env.HAS_VERCEL_SECRETS != 'true'
        run: |
          echo "Vercel deployment requires VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID repository secrets."
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Skipping preview deploy because Vercel secrets are not available."
            exit 0
          fi
          exit 1

      - name: Install Vercel CLI
        if: env.HAS_VERCEL_SECRETS == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        if: env.HAS_VERCEL_SECRETS == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment="$VERCEL_ENV" --token "$VERCEL_TOKEN"

      - name: Build Vercel output
        if: env.HAS_VERCEL_SECRETS == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build $VERCEL_PROD_FLAG --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        id: deploy
        if: env.HAS_VERCEL_SECRETS == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url="$(vercel deploy --prebuilt $VERCEL_PROD_FLAG --token "$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL
        if: github.event_name == 'pull_request' && env.HAS_VERCEL_SECRETS == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}'
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Vercel preview: ${url}`,
            })
